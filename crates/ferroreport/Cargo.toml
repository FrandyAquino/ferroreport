[package]
name = "ferroreport"
description = "Report engine and JasperReports alternative: reads JasperReports JRXML templates (6 and 7) without a JVM and writes PDF, Excel (XLSX), Word (DOCX), PowerPoint (PPTX), ODS, ODT, CSV and HTML, pixel-identical, in milliseconds and constant memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage.workspace = true
keywords = ["jasperreports", "jrxml", "pdf", "xlsx", "report"]
categories = ["text-processing", "template-engine"]

[dependencies]
quick-xml = "0.42"
serde_json = "1"
pdf-writer = "0.15"
subsetter = "0.2"
ttf-parser = "0.25"
# Text shaping (Arabic joining, Indic clusters), the Unicode Bidirectional Algorithm and
# line-break opportunities, for text in scripts that are not one glyph per character.
harfrust = "0.16"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-linebreak = "0.1"
# Hyphenation of long words at line ends (`ferroreport.text.hyphenate`), with the patterns of
# English, Spanish, French, Italian, Portuguese and Catalan embedded (about 60 KB);
# feature `hyphenation-all` embeds every language hypher has (about 1.1 MB more).
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "english", "spanish", "french", "italian", "portuguese", "catalan"], optional = true }
miniz_oxide = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rust_decimal = "1"
thiserror = "2"
png = "0.17"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# SVG images: parsed (text turned into paths with the bundled fonts) and drawn.
resvg = { version = "0.45", default-features = false, features = ["text"] }
base64 = "0.22"
# PDF encryption (AES-256, the standard security handler of PDF 2.0).
aes = "0.8"
sha2 = "0.10"
getrandom = "0.2"

# A faster deflate for PDF streams where it builds everywhere we ship native code. WebAssembly
# keeps miniz_oxide, which is already there for reading PNGs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[features]
default = ["hyphenation"]
hyphenation = ["dep:hypher"]
hyphenation-all = ["hyphenation", "hypher/full"]

[dev-dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
