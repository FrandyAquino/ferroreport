[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ferroreport"
description = "Report engine and JasperReports alternative: reads JasperReports JRXML templates without a JVM and writes PDF, Excel (XLSX), Word (DOCX), PowerPoint (PPTX), ODS, ODT, CSV and HTML in milliseconds and constant memory, pixel-identical to JasperReports. Safe with untrusted templates."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Cristian Encarnacion" }]
keywords = ["jasperreports", "JasperReports alternative", "jrxml", "jrxml to pdf", "pdf", "excel", "xlsx", "docx", "pptx", "ods", "odt", "csv", "report", "invoice"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Office/Business",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/cristianEncarnacion/ferroreport"
Repository = "https://github.com/cristianEncarnacion/ferroreport"
Issues = "https://github.com/cristianEncarnacion/ferroreport/issues"

[tool.maturin]
python-source = "python"
module-name = "ferroreport._ferroreport"
features = ["pyo3/extension-module"]
