# The fixture's font extension: a family with a regular face only. ferroreport reads it from
# the resource folder, JasperReports from its class path (ORACLE_CLASSPATH).
net.sf.jasperreports.extension.registry.factory.fixture.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.fixture=fonts/fonts.xml
