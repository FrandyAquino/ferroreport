# The fixture's font extension: a family with its own font files and a font set. ferroreport
# reads it from the resource folder (tools/compare.py and tests/fixtures.rs pass this folder
# as one), JasperReports from its class path (ORACLE_CLASSPATH).
net.sf.jasperreports.extension.registry.factory.fixture.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.fixture=fonts/fonts.xml
